version: 2

sources:
  - name: spotify_raw
    schema: public
    tables:
      - name: raw_recently_played
        description: "Raw ingestion of recently played tracks from the Spotify API, loaded by ingest.py"
        columns:
          - name: played_at
            description: "Timestamp when the track was played, from Spotify"
          - name: track_id
            description: "Spotify's unique ID for the track"
      - name: raw_artist_genres
        description: "Artist genre tags fetched from Last.fm's artist.getTopTags, keyed by Spotify artist ID"
        columns:
          - name: artist_id
            description: "Spotify's unique ID for the artist"
      - name: raw_audio_features
        description: "ReccoBeats audio features (estimates, not Spotify's) keyed by Spotify track ID. found = false rows are cached misses."
        columns:
          - name: track_id
            description: "Spotify's unique ID for the track"
      - name: track_covers
        description: "Album cover art URL per Spotify track (from the Spotify payload or oEmbed). image_url is null when none is available."
        columns:
          - name: track_id
            description: "Spotify's unique ID for the track"
